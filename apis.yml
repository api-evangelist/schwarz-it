aid: schwarz-it

name: Schwarz IT

description: Schwarz IT (Schwarz IT KG, Neckarsulm, Germany) is the IT service company of the Schwarz Group (Lidl, Kaufland), describing itself
  on GitHub as "the technological heartbeat of the companies of Schwarz Group". It is listed as an affiliated company of Schwarz Digits, the group's
  IT and digital division, and hosts the Schwarz Digits website. Its public GitHub organization publishes the Schwarz API rule definitions for
  the Spectral API linter (api-linter-rules), a Spectral IntelliJ plugin, an API-linting-as-a-service project, a Kotlin RFC 9457 problem-details
  library, community STACKIT Go client and Terraform provider, and SAP/ABAP open-source components.

